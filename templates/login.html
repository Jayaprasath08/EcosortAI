{% extends "base.html" %}{% block title %}Login - EcoSort AI{% endblock %}
{% block content %}<div class="card login"><h1>EcoSort AI</h1><p class="muted">Sign in to continue</p>

<p><button>Login</button></p></form></div>{% endblock %}
